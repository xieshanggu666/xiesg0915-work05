<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>荒野营地求生</title>
<style>
  :root {
    --bg: #14161c;
    --panel: #1e222c;
    --panel-2: #262b38;
    --text: #e8eaf0;
    --muted: #9aa3b5;
    --accent: #e8a84a;
    --accent-dim: #8a6326;
    --danger: #e06a5a;
    --ok: #6ec07a;
    --border: #333a49;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .game {
    width: 100%;
    max-width: 520px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px;
    box-shadow: 0 12px 40px rgba(0,0,0,.4);
  }
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 4px;
  }
  .day { font-size: 22px; font-weight: 700; }
  .phase { color: var(--muted); font-size: 14px; }

  /* 体力 / 危险值 */
  .stats {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin: 14px 0 12px;
  }
  .stat {
    display: flex;
    flex-direction: column;
    gap: 2px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    transition: box-shadow .15s, border-color .15s;
  }
  .stat-label { color: var(--muted); font-size: 12px; }
  .stat-val { font-size: 20px; font-weight: 700; }
  .stat-val.stam { color: var(--ok); }
  .stat-val.dan { color: var(--danger); }
  .stat.high {
    border-color: var(--danger);
    box-shadow: 0 0 12px rgba(224,106,90,.25);
  }

  /* 小背包：材料与制品各占一行，数量一眼可见 */
  .bag {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    margin: 0 0 16px;
  }
  .bag-title { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
  .bag-row { display: flex; gap: 8px; }
  .bag-row + .bag-row { margin-top: 8px; }
  .bag-item {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 4px;
    font-size: 14px;
  }
  .bag-item .num { font-weight: 700; color: var(--accent); min-width: 1.2em; text-align: center; }
  .bag-item.item .num { color: var(--ok); }
  .bag-item.zero { opacity: .4; }

  .ap-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0 0 20px;
    padding: 14px 16px;
    background: var(--panel-2);
    border-radius: 10px;
  }
  .ap-label { color: var(--muted); font-size: 14px; }
  .pips { display: flex; gap: 8px; }
  .pip {
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 2px solid var(--accent-dim);
    background: transparent;
    transition: all .15s;
  }
  .pip.on {
    background: var(--accent);
    border-color: var(--accent);
    box-shadow: 0 0 10px rgba(232,168,74,.5);
  }
  .pip.off { opacity: .25; }
  .ap-count { margin-left: auto; font-weight: 700; color: var(--accent); }

  .actions { display: flex; flex-direction: column; gap: 10px; }
  button {
    font: inherit;
    cursor: pointer;
    border-radius: 8px;
    border: 1px solid var(--border);
    padding: 12px 16px;
    background: var(--panel-2);
    color: var(--text);
    transition: filter .12s, transform .05s;
  }
  button:hover:not(:disabled) { filter: brightness(1.15); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .cost { color: var(--muted); font-size: 13px; margin-left: 6px; }
  .end-day {
    margin-top: 18px;
    width: 100%;
    background: #3a2f1e;
    border-color: var(--accent-dim);
    color: var(--accent);
    font-weight: 600;
  }
  .log {
    margin-top: 18px;
    font-size: 13px;
    color: var(--muted);
    max-height: 120px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .log div::before { content: "· "; }

  /* modal */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.6);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    z-index: 10;
  }
  .overlay.show { display: flex; }
  .modal {
    width: 100%;
    max-width: 400px;
    /* 矮窗口（手机横屏等）下弹窗内容可超出视口：限制高度并允许内部纵向滚动 */
    max-height: calc(100vh - 48px);
    overflow-y: auto;
    background: var(--panel);
    border: 1px solid var(--danger);
    border-radius: 12px;
    padding: 22px;
    box-shadow: 0 0 30px rgba(224,106,90,.15);
  }
  .modal h3 { margin: 0 0 10px; font-size: 17px; }
  .modal h3 .warn { color: var(--danger); }
  .modal p { margin: 0 0 8px; color: var(--text); line-height: 1.6; font-size: 14px; }
  .modal .sub { color: var(--muted); font-size: 13px; }
  .modal .remaining {
    display: inline-block;
    min-width: 1.2em;
    padding: 0 6px;
    margin: 0 2px;
    border-radius: 5px;
    background: rgba(232,168,74,.18);
    color: var(--accent);
    font-weight: 700;
  }
  .modal-btns { display: flex; gap: 10px; margin-top: 20px; }
  .modal-btns button { flex: 1; }
  .btn-cancel {
    background: var(--panel-2);
  }
  .btn-confirm {
    background: #4a2420;
    border-color: var(--danger);
    color: #ffb0a4;
  }

  /* 夜间随机事件弹窗 */
  .event-modal {
    max-width: 440px;
    border-color: var(--accent-dim);
    box-shadow: 0 0 30px rgba(232,168,74,.18);
  }
  .event-modal h3 { color: var(--accent); font-size: 18px; }
  .event-modal .event-desc { color: var(--text); }
  .event-modal .event-tip {
    margin-top: 4px;
    color: var(--muted);
    font-size: 12px;
  }
  .event-choices {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 18px;
  }
  .event-choice {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    text-align: left;
    background: var(--panel-2);
  }
  .event-choice[hidden] { display: none; }
  .event-choice:disabled {
    opacity: .45;
    cursor: not-allowed;
    filter: none;
  }
  .choice-text { flex: 1; }
  .hint {
    display: inline-flex;
    gap: 8px;
    font-size: 12px;
    white-space: nowrap;
    color: var(--muted);
  }
  .hint .up { color: var(--ok); }
  .hint .down { color: var(--danger); }
  .hint .zero { color: var(--muted); }

  /* 制作台弹窗：打开期间可连续制作，关闭后继续用剩余行动点 */
  .craft-modal {
    max-width: 420px;
    border-color: var(--accent-dim);
    box-shadow: 0 0 30px rgba(232,168,74,.15);
  }
  .craft-modal h3 { color: var(--accent); }
  .recipe-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 16px;
  }
  .recipe {
    display: flex;
    align-items: center;
    gap: 10px;
    text-align: left;
    background: var(--panel-2);
    padding: 10px 14px;
  }
  .recipe:disabled { opacity: .45; cursor: not-allowed; }
  .recipe .r-icon { font-size: 20px; }
  .recipe .r-body { flex: 1; }
  .recipe .r-name { font-size: 14px; font-weight: 600; }
  .recipe .r-desc { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .recipe .r-cost { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .recipe .r-cost .lack { color: var(--danger); }

  /* 流浪商人弹窗：每隔几天深夜到访，材料按浮动行情换购，稀有物资限购 */
  .merchant-modal {
    max-width: 420px;
    border-color: var(--accent-dim);
    box-shadow: 0 0 30px rgba(232,168,74,.15);
  }
  .merchant-modal h3 { color: var(--accent); }
  .rare-tag {
    display: inline-block;
    margin-left: 4px;
    padding: 1px 6px;
    border-radius: 999px;
    background: rgba(232,168,74,.18);
    color: var(--accent);
    font-size: 11px;
    vertical-align: 1px;
  }
  .recipe .r-cost .done { color: var(--ok); }

  /* 顶部纪录按钮 */
  .topbar-right { display: flex; align-items: center; gap: 10px; }
  .record-btn {
    padding: 6px 12px;
    font-size: 13px;
    color: var(--accent);
    border-color: var(--accent-dim);
  }

  /* 生存结局弹窗 */
  .over-modal { max-width: 420px; text-align: center; }
  .over-modal h3 { font-size: 20px; }
  .over-result { margin: 16px 0 4px; }
  .over-days { font-size: 46px; font-weight: 800; color: var(--accent); line-height: 1.1; }
  .over-days .unit { font-size: 15px; font-weight: 400; color: var(--muted); margin-left: 4px; }
  .over-caption { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .over-eval { margin-top: 14px; line-height: 1.7; }
  .new-record {
    display: inline-block;
    margin: 10px 0 0;
    padding: 4px 14px;
    border-radius: 999px;
    background: rgba(232,168,74,.18);
    color: var(--accent);
    font-weight: 700;
    font-size: 13px;
  }
  .new-record[hidden] { display: none; }
  .over-best { color: var(--muted); font-size: 13px; margin-top: 8px; }
  .btn-restart {
    background: #3a2f1e;
    border-color: var(--accent-dim);
    color: var(--accent);
    font-weight: 600;
  }

  /* 最佳纪录弹窗 */
  .record-modal {
    max-width: 360px;
    border-color: var(--accent-dim);
    box-shadow: 0 0 30px rgba(232,168,74,.15);
  }
  .record-modal h3 { color: var(--accent); }
  .record-days { font-size: 26px; font-weight: 800; color: var(--accent); }
</style>
</head>
<body>

<div class="game">
  <div class="topbar">
    <div class="day">第 <span id="day">1</span> 天</div>
    <div class="topbar-right">
      <div class="phase" id="phase">夜晚</div>
      <button class="record-btn" id="recordBtn" type="button">🏆 纪录</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat">
      <span class="stat-label">❤ 体力</span>
      <span class="stat-val stam" id="stamina">6</span>
    </div>
    <div class="stat" id="dangerStat">
      <span class="stat-label">☠ 危险</span>
      <span class="stat-val dan" id="danger">0</span>
    </div>
  </div>

  <div class="bag">
    <div class="bag-title">🎒 小背包</div>
    <div class="bag-row" id="bagMaterials">
      <span class="bag-item"><span>🪵 木头</span><span class="num" id="mWood">2</span></span>
      <span class="bag-item"><span>🍖 食物</span><span class="num" id="mFood">2</span></span>
      <span class="bag-item"><span>🌿 草药</span><span class="num" id="mHerb">2</span></span>
    </div>
    <div class="bag-row" id="bagItems">
      <span class="bag-item item"><span>🔥 火把</span><span class="num" id="iTorch">0</span></span>
      <span class="bag-item item"><span>🥖 干粮</span><span class="num" id="iRation">0</span></span>
      <span class="bag-item item"><span>🪤 陷阱</span><span class="num" id="iTrap">0</span></span>
    </div>
  </div>

  <div class="ap-row">
    <span class="ap-label">行动点</span>
    <div class="pips" id="pips"></div>
    <span class="ap-count"><span id="apLeft">2</span> / <span id="apMax">2</span></span>
  </div>

  <div class="actions">
    <button data-act="explore" data-cost="1">外出探索<span class="cost">消耗 1 点 · 带回材料</span></button>
    <button data-act="craft" data-cost="1">使用制作台<span class="cost">消耗 1 点 · 制作道具</span></button>
    <button data-act="rest" data-cost="1">整理营地<span class="cost">消耗 1 点</span></button>
    <button data-act="guard" data-cost="2">通宵守夜<span class="cost">消耗 2 点</span></button>
  </div>

  <button class="end-day" id="endDayBtn">结束当日，进入下一天 →</button>

  <div class="log" id="log"></div>
</div>

<!-- 剩余行动点确认弹窗 -->
<div class="overlay" id="confirmOverlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <h3 id="confirmTitle"><span class="warn">⚠ 行动点尚未用完</span></h3>
    <p>本时段还剩 <span class="remaining" id="remainAp">2</span> 点行动点未使用，结束当日后将被<span style="color:var(--danger)">放弃</span>，无法顺延到明天。</p>
    <p class="sub">确定要现在结束第 <span id="remainDay">1</span> 天吗？</p>
    <div class="modal-btns">
      <button class="btn-cancel" id="cancelEnd">再行动一会儿</button>
      <button class="btn-confirm" id="confirmEnd">放弃点数并结束</button>
    </div>
  </div>
</div>

<!-- 夜间随机事件弹窗：每次结束当日抽一件，必须做出选择 -->
<div class="overlay" id="eventOverlay">
  <div class="modal event-modal" role="dialog" aria-modal="true" aria-labelledby="eventTitle">
    <h3 id="eventTitle"></h3>
    <p class="event-desc" id="eventDesc"></p>
    <p class="event-tip">深夜遭遇突发事件，选择如何应对：</p>
    <div class="event-choices" id="eventChoices">
      <button class="event-choice" id="choice0" hidden></button>
      <button class="event-choice" id="choice1" hidden></button>
      <button class="event-choice" id="choice2" hidden></button>
      <button class="event-choice" id="choice3" hidden></button>
    </div>
  </div>
</div>

<!-- 生存结局弹窗：体力归零或危险顶格时出现，只能「再来一局」 -->
<div class="overlay" id="overOverlay">
  <div class="modal over-modal" role="dialog" aria-modal="true" aria-labelledby="overTitle">
    <h3 id="overTitle"></h3>
    <p class="sub" id="overDesc"></p>
    <div class="over-result">
      <div class="over-days"><span id="overDays">0</span><span class="unit">天</span></div>
      <div class="over-caption">生存天数</div>
    </div>
    <p class="over-eval" id="overEval"></p>
    <p class="new-record" id="newRecordBadge" hidden>🎉 新纪录！</p>
    <p class="over-best" id="overBest"></p>
    <div class="modal-btns">
      <button class="btn-restart" id="restartBtn">🔁 再来一局</button>
    </div>
  </div>
</div>

<!-- 制作台弹窗：消耗 1 点行动点后打开，可连续制作火把/干粮/陷阱，材料不足的配方置灰 -->
<div class="overlay" id="craftOverlay">
  <div class="modal craft-modal" role="dialog" aria-modal="true" aria-labelledby="craftTitle">
    <h3 id="craftTitle">🛠 制作台</h3>
    <p class="sub">借着篝火赶制夜里能用得上的东西，做好后自动收进背包。</p>
    <div class="recipe-list">
      <button class="recipe" id="craftTorch" type="button">
        <span class="r-icon">🔥</span>
        <span class="r-body">
          <span class="r-name">火把</span>
          <span class="r-desc">夜里照明，暴雨里护火、野兽来了也能壮胆驱赶。</span>
        </span>
        <span class="r-cost" id="costTorch">🪵1 🌿1</span>
      </button>
      <button class="recipe" id="craftRation" type="button">
        <span class="r-icon">🥖</span>
        <span class="r-body">
          <span class="r-name">干粮</span>
          <span class="r-desc">耐存的便携口粮，深夜吃上一份能立刻恢复体力。</span>
        </span>
        <span class="r-cost" id="costRation">🍖2 🌿1</span>
      </button>
      <button class="recipe" id="craftTrap" type="button">
        <span class="r-icon">🪤</span>
        <span class="r-body">
          <span class="r-name">陷阱</span>
          <span class="r-desc">布在营地四周，野兽靠近时触发，毫发无伤地退敌。</span>
        </span>
        <span class="r-cost" id="costTrap">🪵2 🍖1</span>
      </button>
    </div>
    <div class="modal-btns">
      <button class="btn-cancel" id="closeCraft">收起制作台</button>
    </div>
  </div>
</div>

<!-- 流浪商人弹窗：每 3 天深夜事件后到访，材料按浮动行情换制品与稀有物资，可连续成交 -->
<div class="overlay" id="merchantOverlay">
  <div class="modal merchant-modal" role="dialog" aria-modal="true" aria-labelledby="merchantTitle">
    <h3 id="merchantTitle">🪙 流浪商人</h3>
    <p class="sub">深夜路过的商人愿意收下你的多余材料。行情每次到访都会浮动，稀有物资每次限购一件。</p>
    <div class="recipe-list">
      <button class="recipe" id="buyTorch" type="button">
        <span class="r-icon">🔥</span>
        <span class="r-body">
          <span class="r-name">火把</span>
          <span class="r-desc">夜里照明，暴雨护火、驱赶野兽都用得上。</span>
        </span>
        <span class="r-cost" id="costBuyTorch"></span>
      </button>
      <button class="recipe" id="buyRation" type="button">
        <span class="r-icon">🥖</span>
        <span class="r-body">
          <span class="r-name">干粮</span>
          <span class="r-desc">耐存的便携口粮，深夜吃上一份能立刻恢复体力。</span>
        </span>
        <span class="r-cost" id="costBuyRation"></span>
      </button>
      <button class="recipe" id="buyTrap" type="button">
        <span class="r-icon">🪤</span>
        <span class="r-body">
          <span class="r-name">陷阱</span>
          <span class="r-desc">布在营地四周，野兽靠近时触发，毫发无伤地退敌。</span>
        </span>
        <span class="r-cost" id="costBuyTrap"></span>
      </button>
      <button class="recipe" id="buyTonic" type="button">
        <span class="r-icon">🧪</span>
        <span class="r-body">
          <span class="r-name">秘药<span class="rare-tag">稀有</span></span>
          <span class="r-desc">商队秘制的药剂，喝下立刻体力 +3。每次到访限购一件。</span>
        </span>
        <span class="r-cost" id="costBuyTonic"></span>
      </button>
      <button class="recipe" id="buyCharm" type="button">
        <span class="r-icon">🧿</span>
        <span class="r-body">
          <span class="r-name">护身符<span class="rare-tag">稀有</span></span>
          <span class="r-desc">刻着符文的骨片，挂在营地震慑野兽，危险 -2。每次到访限购一件。</span>
        </span>
        <span class="r-cost" id="costBuyCharm"></span>
      </button>
    </div>
    <div class="modal-btns">
      <button class="btn-cancel" id="closeMerchant">送走商人</button>
    </div>
  </div>
</div>

<!-- 最佳纪录弹窗：游戏中随时可打开翻看 -->
<div class="overlay" id="recordOverlay">
  <div class="modal record-modal" role="dialog" aria-modal="true" aria-labelledby="recordTitle">
    <h3 id="recordTitle">🏆 最佳纪录</h3>
    <p>最长生存：<span class="record-days" id="recordDays">–</span> 天</p>
    <p class="sub" id="recordMeta"></p>
    <div class="modal-btns">
      <button class="btn-cancel" id="closeRecord">关闭</button>
    </div>
  </div>
</div>

<script>
"use strict";

// ===== 游戏状态 =====
const AP_PER_NIGHT = 2; // 夜晚可用行动点
// mat 材料（探索获取）/ item 制品（制作台合成）/ sta 体力 / dan 危险
const STAT_CAP = { sta: 10, dan: 10, pool: 99 };
const INIT_MATS = { wood: 2, food: 2, herb: 2 }; // 初始背包里的材料

const state = {
  day: 1,
  apMax: AP_PER_NIGHT,
  ap: AP_PER_NIGHT,
  mats: { ...INIT_MATS },
  items: { torch: 0, ration: 0, trap: 0 },
  stamina: 6,

// 由日期与货品位次决定的伪随机数：同一晚行情固定、不同晚浮动，且不消耗 Math.random
function hashRand(a, b, c) {
  let h = 2166136261;
  [a, b, c].forEach((n) => {
    h ^= n + 1;
    h = Math.imul(h, 16777619);
  });
  h ^= h >>> 13;
  h = Math.imul(h, 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}

function poolAmount(key) {
  const meta = RESOURCE_META[key];
  const id = key.split(".")[1];
  return meta.type === "mat" ? state.mats[id] : state.items[id];
}
function setPoolAmount(key, val) {
  const meta = RESOURCE_META[key];
  const id = key.split(".")[1];
  if (meta.type === "mat") state.mats[id] = val;
  else state.items[id] = val;
}
function canAfford(cost) {
  return POOL_KEYS.every((k) => poolAmount(k) >= (cost[k] || 0));
}

const BEST_KEY = "camp-survival-best";
// 隐私模式等场景下访问 localStorage 会抛错；测试环境也可能没有，统一兜底为 null
const storage = (() => {
  try {
    if (typeof localStorage !== "undefined") return localStorage;
  } catch (e) { /* 忽略，按无存储处理 */ }
  return null;
})();

function loadBest() {
  if (!storage) return null;
  try {
    const raw = storage.getItem(BEST_KEY);
    if (!raw) return null;
    const rec = JSON.parse(raw);
    if (!rec || typeof rec.days !== "number") return null; // 数据损坏就当没有
    return rec;
  } catch (e) {
    return null;
  }
}

function saveBest(rec) {
  if (!storage) return;
  try {
    storage.setItem(BEST_KEY, JSON.stringify(rec));
  } catch (e) { /* 写入失败不耽误本局结算 */ }
}

// 探索收获：随机挑 1～2 种材料，各 +1（数量钳制在上限内）
function rollExploreYield() {
  const n = Math.random() < 0.5 ? 1 : 2;
  const pool = MAT_KEYS.slice();
  const yield_ = {};
  for (let i = 0; i < n; i++) {
    const idx = Math.floor(Math.random() * pool.length);
    const key = pool.splice(idx, 1)[0];
    yield_[key] = 1;
  }
  return yield_;
}

document.querySelectorAll("[data-cost]").forEach((btn) => {

    state.ap -= cost;
    addLog(`第 ${state.day} 天夜晚：${ACT_NAMES[act]}（-${cost} 点）`);

      const got = Object.keys(yield_)
        .map((k) => {
          const key = "mat." + k;
          setPoolAmount(key, clamp(poolAmount(key) + yield_[k], 0, STAT_CAP.pool));
          return `${RESOURCE_META[key].icon}${RESOURCE_META[key].name}+${yield_[k]}`;

    // 事件弹窗：Tab 在可用选项间循环；Esc 不关闭，必须选一项
    if (e.key === "Tab") {

  if (overOpen) {
    // 结局弹窗：Esc 不关闭，Tab 锁在「再来一局」上

    // 制作台弹窗：Esc 收起；Tab 在可做配方与收起按钮间循环
    if (e.key === "Escape") {
      e.preventDefault();

      e.preventDefault();
      cycleFocus(e, craftRecipeBtns.filter((b) => !b.disabled).concat(closeCraftBtn));
    }
    return;
  }
  if (merchantOpen) {
    // 商人弹窗：Esc 送走商人；Tab 在可成交的货物与「送走商人」间循环

      cycleFocus(e, merchantBuyBtns.filter((b) => !b.disabled).concat(closeMerchantBtn));

  if (recordOpen) {

    // 显式接管焦点移动，在弹窗两个按钮间循环，不依赖默认 Tab 行为
    e.preventDefault();
    cycleFocus(e, [cancelBtn, confirmBtn]);

});

function cycleFocus(e, list) {
  const idx = list.indexOf(document.activeElement);
  const dir = e.shiftKey ? -1 : 1;
  const next = list[(idx + dir + list.length) % list.length];
  next.focus();
}

/**
 * 请求结束当日：
 * - 行动点已用完：直接结算
 * - 仍有剩余：先弹确认，说明将放弃几点，确认后才结算
 * 结算后进入新一天之前，抽一件夜间随机事件。
 */
function requestEndDay() {
  if (state.ap > 0) {
    showConfirm(state.ap);
  } else {
    finishDay();
  }

function showConfirm(remaining) {
  if (confirmOpen) return;
  confirmOpen = true;
  remainApEl.textContent = remaining;

  gameEl.inert = true;
  lastFocused = document.activeElement;
  cancelBtn.focus();
}

function hideConfirm() {
  if (!confirmOpen) return;
  confirmOpen = false;
  overlayEl.classList.remove("show");
  gameEl.inert = false;
  if (lastFocused && typeof lastFocused.focus === "function") {
    lastFocused.focus();
  }
}

// 按当前背包材料刷新配方按钮：不足的配方置灰
function refreshRecipes() {
  craftRecipeBtns.forEach((btn) => {
    const recipe = RECIPES.find((r) => r.btnId === btn.id);
    btn.disabled = !canAfford(recipe.cost);
  });
}

// 配方按钮：材料够就做一件（不额外花行动点，打开制作台时已扣 1 点）
RECIPES.forEach((recipe) => {
  const btn = $(recipe.btnId);
  btn.addEventListener("click", () => {
    if (!craftOpen || !canAfford(recipe.cost)) return;
    POOL_KEYS.forEach((k) => {
      if (recipe.cost[k]) setPoolAmount(k, poolAmount(k) - recipe.cost[k]);
    });
    setPoolAmount("item." + recipe.id, poolAmount("item." + recipe.id) + 1);
    addLog(`　└ 制作了 ${RESOURCE_META["item." + recipe.id].icon}${recipe.name} ×1`);
    render();
    refreshRecipes();
    // 做完后若当前配方仍可继续做，焦点留在它上面；否则移到下一个可做配方
    if (btn.disabled) {
      const next = craftRecipeBtns.find((b) => !b.disabled);
      if (next) next.focus();
    }
  });
});

// ===== 流浪商人 =====
// 每次到访按当天日期重新生成行情：同一晚价格固定，不同晚在区间内浮动
function showMerchant(day) {
  merchantOpen = true;
  merchantDay = day;
  merchantStock = MERCHANT_OFFERS.map((offer, i) => ({
    offer,
    cost: Object.fromEntries(
      Object.entries(offer.range).map(([k, [lo, hi]], j) =>
        [k, lo + Math.floor(hashRand(day, i, j) * (hi - lo + 1))])
    ),
    soldOut: false,
  }));
  addLog(`第 ${day} 天深夜：流浪商人到访，可用多余材料换购物资`);
  refreshMerchant();
  merchantOverlayEl.classList.add("show");

  lastFocused = document.activeElement;
  const first = merchantBuyBtns.find((b) => !b.disabled);
  (first || closeMerchantBtn).focus();
}

function hideMerchant() {
  if (!merchantOpen) return;

  gameEl.inert = false;

  if (lastFocused && typeof lastFocused.focus === "function") {
    lastFocused.focus();
  }
}

// 按当前背包刷新货物：材料不足的置灰并标红所缺材料，稀有物资售罄后显示「已成交」
function refreshMerchant() {
  merchantStock.forEach((entry) => {
    const btn = $(entry.offer.btnId);
    const costEl = $(entry.offer.costId);
    if (entry.soldOut) {
      btn.disabled = true;
      costEl.innerHTML = `<span class="done">已成交</span>`;
      return;
    }
    btn.disabled = !canAfford(entry.cost);
    costEl.innerHTML = Object.entries(entry.cost)
      .map(([k, v]) => {
        const meta = RESOURCE_META[k];
        const lack = poolAmount(k) < v ? ` class="lack"` : "";
        return `<span${lack}>${meta.icon}×${v}</span>`;
      })
      .join(" ");
  });
}

// 换购：扣材料、给货品（稀有物资的效果立即生效），成交结果写进当天日志
MERCHANT_OFFERS.forEach((offer) => {
  $(offer.btnId).addEventListener("click", () => {
    if (!merchantOpen) return;
    const entry = merchantStock.find((e) => e.offer === offer);
    if (!entry || entry.soldOut || !canAfford(entry.cost)) return;
    POOL_KEYS.forEach((k) => {
      if (entry.cost[k]) setPoolAmount(k, poolAmount(k) - entry.cost[k]);
    });
    applyEffects(offer.gives);
    if (offer.rare) entry.soldOut = true;
    const paid = Object.entries(entry.cost)
      .map(([k, v]) => `${RESOURCE_META[k].icon}${RESOURCE_META[k].name}×${v}`)
      .join("、");
    const statPart = ["sta", "dan"]
      .filter((k) => offer.gives[k])
      .map((k) => `${STAT_LABEL[k]} ${offer.gives[k] > 0 ? "+" : ""}${offer.gives[k]}`)
      .join("，");
    addLog(
      `第 ${merchantDay} 天深夜：与商人成交，付出 ${paid}，` +
      `换得 ${offer.icon}${offer.name}×1${statPart ? `（${statPart}）` : ""}`
    );
    render();
    refreshMerchant();
    // 材料花光后当前货物可能买不起了，焦点移到下一个可成交货物
    if ($(offer.btnId).disabled) {
      const next = merchantBuyBtns.find((b) => !b.disabled);
      if (next) next.focus();
    }
  });
});

function finishDay() {
  if (state.ap > 0) {
    addLog(`第 ${state.day} 天结束：放弃了 ${state.ap} 点未使用的行动点`);
  } else {
    addLog(`第 ${state.day} 天结束：行动点已全部用完`);
  }
  const endedDay = state.day;
  state.day += 1;
  state.ap = state.apMax; // 新的一天恢复点数，不累计昨日剩余
  render();
  showEvent(drawEvent(), endedDay);
}

// ===== 随机事件 =====
const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

function drawEvent() {
  return EVENTS[Math.floor(Math.random() * EVENTS.length)];
}

// eff 字段 → 中文名称
const STAT_LABEL = { sta: "体力", dan: "危险" };
function effEntries(eff) {
  // 资源按背包顺序展示，体力、危险排在最后，日志读起来更顺
  return POOL_KEYS
    .filter((k) => eff[k])
    .map((k) => [k, eff[k]])
    .concat(["sta", "dan"].filter((k) => eff[k]).map((k) => [k, eff[k]]));
}
const effName = (key) =>
  RESOURCE_META[key] ? `${RESOURCE_META[key].icon}${RESOURCE_META[key].name}` : STAT_LABEL[key];
function effectDeltas(eff) {
  return effEntries(eff).filter(([, d]) => d !== 0);
}
function effectText(eff) {
  const deltas = effectDeltas(eff);
  if (!deltas.length) return "无变化";
  return deltas
    .map(([k, d]) => `${effName(k)} ${d > 0 ? "+" : ""}${d}`)
    .join("，");
}
function effectHintHTML(eff) {
  const deltas = effectDeltas(eff);
  if (!deltas.length) return `<span class="zero">无变化</span>`;
  return deltas
    .map(([k, d]) => {
      const sign = d > 0 ? "+" : "";
      return `<span class="${d > 0 ? "up" : "down"}">${effName(k)} ${sign}${d}</span>`;
    })
    .join("");
}
// 选项里的负向消耗（材料/道具）是否都够用
function choiceAvailable(eff) {
  return POOL_KEYS.every((k) => !eff[k] || poolAmount(k) + eff[k] >= 0);
}
// 不足时提示还差什么，例如「需要 🔥火把 ×1」
function needText(eff) {
  const needs = POOL_KEYS
    .filter((k) => eff[k] < 0 && poolAmount(k) + eff[k] < 0)
    .map((k) => `${effName(k)}×${-eff[k]}`);
  return needs.length ? `需要 ${needs.join("、")}` : "";
}

function applyEffects(eff) {
  POOL_KEYS.forEach((k) => {
    if (eff[k]) setPoolAmount(k, clamp(poolAmount(k) + eff[k], 0, STAT_CAP.pool));
  });
  state.stamina = clamp(state.stamina + (eff.sta || 0), 0, STAT_CAP.sta);
  state.danger = clamp(state.danger + (eff.dan || 0), 0, STAT_CAP.dan);
}

function showEvent(ev, endedDay) {
  eventOpen = true;
  currentEvent = { ev, endedDay };
  eventTitleEl.textContent = `${ev.icon} ${ev.title}`;
  eventDescEl.textContent = ev.desc;
  ev.choices.forEach((choice, i) => {
    const btn = choiceEls[i];
    const available = choiceAvailable(choice.eff);
    btn.hidden = false;
    btn.disabled = !available;
    const hint = available
      ? effectHintHTML(choice.eff)
      : `<span class="down">${needText(choice.eff)}</span>`;
    btn.innerHTML =
      `<span class="choice-text">${choice.text}</span>` +
      `<span class="hint">${hint}</span>`;
  });
  // 选项不足 4 个时，藏起多余按钮
  for (let i = ev.choices.length; i < choiceEls.length; i++) {
    choiceEls[i].hidden = true;
    choiceEls[i].disabled = false;
  }
  eventOverlayEl.classList.add("show");
  gameEl.inert = true;
  lastFocused = document.activeElement;
  (choiceEls.find((b) => !b.hidden && !b.disabled) || choiceEls[0]).focus();
}

function hideEvent() {
  eventOpen = false;
  eventOverlayEl.classList.remove("show");
  gameEl.inert = false;
  currentEvent = null;
  if (lastFocused && typeof lastFocused.focus === "function") {
    lastFocused.focus();
  }
}

choiceEls.forEach((btn, i) => {
  btn.addEventListener("click", () => {
    if (!eventOpen || !currentEvent || btn.disabled) return;
    const choice = currentEvent.ev.choices[i];
    if (!choice) return;
    const endedDay = currentEvent.endedDay;
    applyEffects(choice.eff); // 选项直接改物资、体力、危险值
    addLog(
      `第 ${endedDay} 天深夜：遭遇「${currentEvent.ev.title}」，` +
      `选择「${choice.text}」（${effectText(choice.eff)}）`
    );
    hideEvent();
    render();
    // 结算后判定生存结局：体力归零或危险顶格，本局到此为止
    const ending = checkGameOver();
    if (ending) {
      endRun(ending, endedDay);
    } else if (endedDay % MERCHANT_INTERVAL === 0) {
      showMerchant(endedDay); // 每隔几天，深夜事件后流浪商人到访
    }
  });
});

// ===== 生存结局 =====
function checkGameOver() {
  if (state.stamina <= 0) return "exhausted";
  if (state.danger >= STAT_CAP.dan) return "overrun";
  return null;
}

// 本局结束：展示生存天数与评语，并把最好成绩写进本地纪录
function endRun(endingId, days) {
  gameOver = true;
  overOpen = true;
  render(); // 刷新一次界面：禁用行动与结束当日按钮
  const ending = ENDINGS[endingId];
  const prev = loadBest();
  const isRecord = !prev || days > prev.days;
  if (isRecord) {
    saveBest({ days, ending: endingId, date: new Date().toISOString().slice(0, 10) });
  }
  overTitleEl.textContent = `${ending.icon} ${ending.title}`;
  overDescEl.textContent = ending.desc;
  overDaysEl.textContent = days;
  overEvalEl.textContent = evaluation(days);
  newRecordEl.hidden = !isRecord;
  overBestEl.textContent = `历史最佳：${isRecord ? days : prev.days} 天`;
  addLog(`第 ${days} 天深夜：${ending.title}，本局结束（共生存 ${days} 天）`);
  overOverlayEl.classList.add("show");
  gameEl.inert = true;
  lastFocused = document.activeElement;
  restartBtn.focus();
}

// 再来一局：全部状态归零，日志清空
restartBtn.addEventListener("click", () => {
  if (!overOpen) return;
  state.day = 1;
  state.apMax = AP_PER_NIGHT;
  state.ap = AP_PER_NIGHT;
  state.mats = { ...INIT_MATS };
  state.items = { torch: 0, ration: 0, trap: 0 };
  state.stamina = 6;
  state.danger = 0;
  gameOver = false;
  overOpen = false;
  merchantOpen = false;
  merchantStock = [];
  overOverlayEl.classList.remove("show");
  merchantOverlayEl.classList.remove("show");
  gameEl.inert = false;
  logEl.innerHTML = "";
  addLog("新的一局开始：营地重新燃起篝火。");
  render();
  endDayBtn.focus();
});

// ===== 最佳纪录弹窗 =====
recordBtn.addEventListener("click", () => {
  if (gameOver || confirmOpen || eventOpen || craftOpen || merchantOpen || recordOpen) return;
  showRecord();
});
closeRecordBtn.addEventListener("click", hideRecord);

function showRecord() {
  if (recordOpen) return;
  recordOpen = true;
  const best = loadBest();
  if (best) {
    const endName = ENDINGS[best.ending] ? ENDINGS[best.ending].title : "未知结局";
    recordDaysEl.textContent = best.days;
    recordMetaEl.textContent = `结局：${endName} · ${best.date || "日期不详"}`;
  } else {
    recordDaysEl.textContent = "–";
    recordMetaEl.textContent = "还没有任何纪录，先努力活过几个夜晚吧。";
  }
  recordOverlayEl.classList.add("show");
  gameEl.inert = true;
  lastFocused = document.activeElement;
  closeRecordBtn.focus();
}

function hideRecord() {
  if (!recordOpen) return;
  recordOpen = false;
  recordOverlayEl.classList.remove("show");
  gameEl.inert = false;
  if (lastFocused && typeof lastFocused.focus === "function") {
    lastFocused.focus();
  }
}

render();
</script>
